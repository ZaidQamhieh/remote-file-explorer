name: Host agent release

# Agent releases use their own tag namespace so this workflow never races the
# mobile APK release workflow, which publishes v* tags.
on:
  push:
    tags: ['agent-v*']

permissions:
  contents: write

jobs:
  verify:
    name: CI gates
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    needs: verify
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            extension: tar.gz
          - goos: linux
            goarch: arm64
            extension: tar.gz
          - goos: darwin
            goarch: amd64
            extension: tar.gz
          - goos: darwin
            goarch: arm64
            extension: tar.gz
          - goos: windows
            goarch: amd64
            extension: zip
          - goos: windows
            goarch: arm64
            extension: zip
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.6'
          cache-dependency-path: agent/go.sum

      - name: Build and archive host agent
        id: package
        working-directory: agent
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          RELEASE_TAG: ${{ github.ref_name }}
          ARCHIVE_EXTENSION: ${{ matrix.extension }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^agent-v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Expected an agent-vX.Y.Z tag; received '$RELEASE_TAG'"
            exit 1
          fi
          version="${RELEASE_TAG#agent-v}"
          package="${RELEASE_TAG}-${GOOS}-${GOARCH}.${ARCHIVE_EXTENSION}"
          stage="$RUNNER_TEMP/rfe-agent-stage"
          mkdir -p "$stage"
          binary=rfe-agent
          if [[ "$GOOS" == windows ]]; then binary=rfe-agent.exe; fi
          go build -trimpath -ldflags "-s -w -X main.version=${version}" -o "$stage/$binary" ./cmd/agent
          if [[ "$ARCHIVE_EXTENSION" == zip ]]; then
            (cd "$stage" && zip -q "$GITHUB_WORKSPACE/agent/$package" "$binary")
          else
            tar -C "$stage" -czf "$GITHUB_WORKSPACE/agent/$package" "$binary"
          fi
          echo "path=agent/$package" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-${{ matrix.goos }}-${{ matrix.goarch }}
          path: agent/${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}.${{ matrix.extension }}
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish host binaries
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          path: dist
          merge-multiple: true

      - name: Create SHA-256 manifest
        run: |
          set -euo pipefail
          mapfile -t archives < <(find dist -type f -name 'agent-v*' | sort)
          if [[ "${#archives[@]}" -ne 6 ]]; then
            echo "::error::Expected six host archives, found ${#archives[@]}"
            find dist -maxdepth 4 -print
            exit 1
          fi
          for archive in "${archives[@]}"; do
            name="${archive##*/}"
            if [[ "$archive" != "dist/$name" ]]; then
              if [[ -e "dist/$name" ]]; then
                echo "::error::Duplicate host archive name '$name'"
                exit 1
              fi
              mv "$archive" "dist/$name"
            fi
          done
          find dist -depth -mindepth 1 -type d -empty -delete
          test "$(find dist -mindepth 1 -maxdepth 1 -type f -name 'agent-v*' | wc -l)" -eq 6
          (cd dist && sha256sum agent-v* > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Publish dedicated host-agent release
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#agent-v}"
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Remote File Explorer Agent ${version}" \
            --generate-notes \
            --latest=false
