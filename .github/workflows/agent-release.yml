name: Host agent release

# Agent releases use their own tag namespace so this workflow never races the
# mobile APK release workflow, which publishes v* tags.
on:
  push:
    tags: ['agent-v*']

permissions:
  contents: write

jobs:
  verify:
    name: CI gates
    uses: ./.github/workflows/ci.yml

  # The Rust sidecars are built once per target, then packaged beside the Go agent. Linux and Windows are
  # cross-compiled with zig (Linux against glibc 2.28 so the same file runs on old and new distros); macOS builds
  # on a macOS runner because it needs the Apple SDK.
  sidecars:
    name: Sidecars ${{ matrix.goos }}-${{ matrix.goarch }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goos: linux, goarch: amd64, runner: ubuntu-24.04, rust: x86_64-unknown-linux-gnu, zig: 'x86_64-unknown-linux-gnu.2.28', ext: ''}
          - {goos: linux, goarch: arm64, runner: ubuntu-24.04, rust: aarch64-unknown-linux-gnu, zig: 'aarch64-unknown-linux-gnu.2.28', ext: ''}
          - {goos: windows, goarch: amd64, runner: ubuntu-24.04, rust: x86_64-pc-windows-gnu, zig: x86_64-pc-windows-gnu, ext: .exe}
          - {goos: windows, goarch: arm64, runner: ubuntu-24.04, rust: aarch64-pc-windows-gnullvm, zig: aarch64-pc-windows-gnullvm, ext: .exe}
          - {goos: darwin, goarch: amd64, runner: macos-14, rust: x86_64-apple-darwin, zig: '', ext: ''}
          - {goos: darwin, goarch: arm64, runner: macos-14, rust: aarch64-apple-darwin, zig: '', ext: ''}
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            agent-rs/target
          key: rust-rel-${{ matrix.rust }}-${{ hashFiles('agent-rs/Cargo.lock', 'agent-rs/rust-toolchain.toml') }}
          restore-keys: rust-rel-${{ matrix.rust }}-

      - name: Add Rust target
        working-directory: agent-rs
        run: rustup target add ${{ matrix.rust }}

      - name: Install zig and cargo-zigbuild
        if: matrix.zig != ''
        working-directory: agent-rs
        run: |
          pip install --user 'ziglang==0.16.0' 'cargo-zigbuild==0.23.4'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build sidecars
        working-directory: agent-rs
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^agent-v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Expected an agent-vX.Y.Z tag; received '$RELEASE_TAG'"
            exit 1
          fi
          export RFE_RELEASE_VERSION="${RELEASE_TAG#agent-v}"
          if [[ -n "${{ matrix.zig }}" ]]; then
            cargo zigbuild --release --locked -p rfe-indexd -p rfe-thumbd --target "${{ matrix.zig }}"
          else
            cargo build --release --locked -p rfe-indexd -p rfe-thumbd --target "${{ matrix.rust }}"
          fi
          mkdir -p "$RUNNER_TEMP/sidecars"
          for n in rfe-indexd rfe-thumbd; do
            cp "target/${{ matrix.rust }}/release/$n${{ matrix.ext }}" "$RUNNER_TEMP/sidecars/"
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sidecars-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ runner.temp }}/sidecars
          if-no-files-found: error
          retention-days: 1

  build:
    name: Package ${{ matrix.goos }}-${{ matrix.goarch }}
    needs: sidecars
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            extension: tar.gz
          - goos: linux
            goarch: arm64
            extension: tar.gz
          - goos: darwin
            goarch: amd64
            extension: tar.gz
          - goos: darwin
            goarch: arm64
            extension: tar.gz
          - goos: windows
            goarch: amd64
            extension: zip
          - goos: windows
            goarch: arm64
            extension: zip
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.6'
          cache-dependency-path: agent/go.sum

      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: sidecars-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ runner.temp }}/sidecars

      # Builds the agent, copies the sidecars beside it and writes rfe-sidecars.txt (sha256 + version), so the
      # agent only runs sidecars that belong to this exact release.
      - name: Build and archive host agent with its sidecars
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^agent-v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Expected an agent-vX.Y.Z tag; received '$RELEASE_TAG'"
            exit 1
          fi
          tools/package-agent.sh "${{ matrix.goos }}" "${{ matrix.goarch }}" "${RELEASE_TAG#agent-v}" \
            "$RUNNER_TEMP/sidecars" "agent/${RELEASE_TAG}-${{ matrix.goos }}-${{ matrix.goarch }}.${{ matrix.extension }}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-${{ matrix.goos }}-${{ matrix.goarch }}
          path: agent/${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}.${{ matrix.extension }}
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish host binaries
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: agent-*
          path: dist
          merge-multiple: true

      - name: Create SHA-256 manifest
        run: |
          set -euo pipefail
          mapfile -t archives < <(find dist -type f -name 'agent-v*' | sort)
          if [[ "${#archives[@]}" -ne 6 ]]; then
            echo "::error::Expected six host archives, found ${#archives[@]}"
            find dist -maxdepth 4 -print
            exit 1
          fi
          for archive in "${archives[@]}"; do
            name="${archive##*/}"
            if [[ "$archive" != "dist/$name" ]]; then
              if [[ -e "dist/$name" ]]; then
                echo "::error::Duplicate host archive name '$name'"
                exit 1
              fi
              mv "$archive" "dist/$name"
            fi
          done
          find dist -depth -mindepth 1 -type d -empty -delete
          test "$(find dist -mindepth 1 -maxdepth 1 -type f -name 'agent-v*' | wc -l)" -eq 6
          (cd dist && sha256sum agent-v* > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Publish dedicated host-agent release
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#agent-v}"
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Remote File Explorer Agent ${version}" \
            --generate-notes \
            --latest=false
