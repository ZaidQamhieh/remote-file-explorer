name: Desktop release

# Publishes the Linux desktop app (deb, AppImage, SBOM, SHA256SUMS) as a GitHub Release.
#
# **Cutting a release:** set `version` in desktop/src-tauri/tauri.conf.json and desktop/src-tauri/Cargo.toml, commit, then
# push a matching tag:
#
#     git tag desktop-v1.0.0 && git push origin desktop-v1.0.0
#     git tag desktop-v1.0.0-rc.1 && git push origin desktop-v1.0.0-rc.1   # a suffix makes it a pre-release
#
# The tag namespace is its own: release.yml (`v*`) and agent-release.yml (`agent-v*`) never match it. The release is
# always created with --latest=false, so releases/latest and the Android updater's latest.json keep pointing at the APK.
on:
  push:
    tags: ['desktop-v*']

permissions:
  contents: read

# A tag run publishes and is never cancelled.
concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The published files come from a commit that passed the desktop gates and built the bundles (desktop.yml).
  verify:
    name: Desktop gates and bundles
    uses: ./.github/workflows/desktop.yml

  publish:
    name: Publish release
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      # The tag names the version; the app must report the same one.
      - name: Tag matches the app version
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#desktop-v}"
          core="${version%%-*}"
          conf=$(python3 -c 'import json; print(json.load(open("desktop/src-tauri/tauri.conf.json"))["version"])')
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' desktop/src-tauri/Cargo.toml | head -n1)
          for found in "$conf" "$crate"; do
            if [[ "$found" != "$version" && "$found" != "$core" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match app version $found (tauri.conf.json $conf, Cargo.toml $crate)"
              exit 1
            fi
          done

      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: rfe-desktop-linux
          path: dist

      # GitHub rewrites a space in an asset name to a dot, which would break the names in SHA256SUMS. The product name
      # has a space ("RFE Desktop_1.0.0_amd64.deb"), so the files get hyphens before the sums are written again.
      - name: Release file names and checksums
        working-directory: dist
        run: |
          set -euo pipefail
          for f in *; do
            if [[ "$f" == *" "* ]]; then mv -- "$f" "${f// /-}"; fi
          done
          test "$(find . -maxdepth 1 -type f -name '*.deb' | wc -l)" -eq 1
          test "$(find . -maxdepth 1 -type f -name '*.AppImage' | wc -l)" -eq 1
          test -f rfe-desktop.sbom.json
          ../desktop/scripts/checksums.sh .
          ../desktop/scripts/verify-download.sh SHA256SUMS ./*.deb ./*.AppImage ./rfe-desktop.sbom.json
          if grep -q ' ' <(cut -c67- SHA256SUMS); then echo "::error::a name in SHA256SUMS still has a space"; exit 1; fi
          cat SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.deb
            dist/*.AppImage
            dist/rfe-desktop.sbom.json

      - name: Publish desktop release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#desktop-v}"
          flags=()
          if [[ "$version" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Remote File Explorer Desktop ${version}" \
            --generate-notes \
            --latest=false "${flags[@]}"
