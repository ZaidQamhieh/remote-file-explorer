name: Desktop (Tauri)

# The desktop app lives in desktop/. It is not part of the Android release, so release.yml and ci.yml ignore desktop/**;
# this workflow is its only gate. Its tests run against an agent built from the same checkout.
on:
  push:
    branches: [master, main]
    paths: ['desktop/**', 'agent/**', 'protocol/**', '.github/workflows/desktop.yml']
  pull_request:
    branches: [master, main]
    paths: ['desktop/**', 'agent/**', 'protocol/**', '.github/workflows/desktop.yml']

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: fmt, clippy, tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.6'
          cache-dependency-path: agent/go.sum

      # Tauri 2 on Linux links against WebKitGTK; the tests build the whole crate, so the dev packages are needed.
      # libdbus-1-dev is for the keystore (keyring -> dbus -> libdbus-sys, which has no vendored build here).
      # GTK pulls it in transitively today; it is named so the build does not depend on that.
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev libdbus-1-dev

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-audit
            desktop/src-tauri/target
          key: desktop-${{ runner.os }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: desktop-${{ runner.os }}-

      # rust-toolchain.toml pins the compiler; rustup 1.28+ does not install it on first use.
      - name: Rust toolchain
        run: rustup toolchain install

      - name: Build the agent the tests run against
        working-directory: agent
        run: go build -o "$RUNNER_TEMP/rfe-agent" ./cmd/agent

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo test
        env:
          RFE_AGENT_BIN: ${{ runner.temp }}/rfe-agent
        run: cargo test --locked

      # Accepted advisories are listed with reasons in .cargo/audit.toml; any new warning fails the job.
      - name: cargo audit
        run: |
          command -v cargo-audit >/dev/null || cargo install cargo-audit --locked --version 0.22.2
          cargo audit --deny warnings

  bundle:
    name: deb and AppImage
    needs: rust
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev libdbus-1-dev file xdg-utils

      - name: Rust toolchain
        run: rustup toolchain install

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-tauri
            desktop/src-tauri/target
          key: desktop-bundle-${{ runner.os }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: desktop-bundle-${{ runner.os }}-

      # Same version as the tauri crate in Cargo.lock.
      - name: tauri-cli
        run: command -v cargo-tauri >/dev/null || cargo install tauri-cli --version 2.12.1 --locked

      # linuxdeploy and its AppImage plugin are downloaded by the bundler at build time and are not
      # pinned by it; the artifact is for testing, and release signing/provenance is a separate task.
      - name: Bundle
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          NO_STRIP: 'true'
        run: cargo tauri build --ci --bundles deb,appimage

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rfe-desktop-linux
          path: |
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14
