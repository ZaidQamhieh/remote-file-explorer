name: Release

# Builds the React Native Android app (mobile/) on a GitHub runner, signs it with the production key and publishes it
# (plus a `latest.json` manifest) as a GitHub Release, which is what the app's updater reads.
#
# **Cutting a release:** set `expo.version` and `expo.android.versionCode` in mobile/app.json (the code MUST increase,
# OTA detection compares it), commit, then push a matching tag:
#
#     git tag v2.0.0 && git push origin v2.0.0          # becomes the Latest release: every installed app sees it
#     git tag v2.0.0-rc.1 && git push origin v2.0.0-rc.1  # a tag with a suffix is a pre-release, never Latest
#
# A push to an `rn/**` branch runs the whole pipeline (CI gates, signed build, manifest) as a dry run and keeps the
# APK as a workflow artifact; only a `v*` tag publishes anything.

on:
  push:
    tags: ['v*']
    branches: ['rn/**']

permissions:
  contents: write

jobs:
  # The published artifact must come from a commit that passed the same checks CI runs (PR-70).
  verify:
    name: CI gates
    uses: ./.github/workflows/ci.yml

  verify-mobile:
    name: Mobile gates
    uses: ./.github/workflows/mobile.yml

  release:
    name: Build & publish APK
    needs: [verify, verify-mobile]
    runs-on: ubuntu-24.04
    # A hung build fails here instead of holding the runner for the 6-hour default.
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: npm ci
        working-directory: mobile
        run: npm ci

      # A cold build of the native libraries takes tens of minutes; with the caches restored it is mostly a relink.
      - uses: ./.github/actions/android-cache

      # Recreate the release signing material from secrets so the APK carries the SAME key as every earlier release;
      # without it Android refuses to install the update. The build script checks the certificate digest afterwards.
      - name: Configure release signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret missing, cannot sign release"
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          printf '%s' "$STORE_PW" > "$RUNNER_TEMP/storepass"
          printf '%s' "$KEY_PW" > "$RUNNER_TEMP/keypass"
          {
            echo "RFE_RELEASE_KEYSTORE=$RUNNER_TEMP/upload-keystore.jks"
            echo "RFE_RELEASE_STOREPASS_FILE=$RUNNER_TEMP/storepass"
            echo "RFE_RELEASE_KEYPASS_FILE=$RUNNER_TEMP/keypass"
            echo "RFE_RELEASE_KEY_ALIAS=$KEY_ALIAS"
          } >> "$GITHUB_ENV"

      # sccache (Rust) caches each C++ compile of the native libraries, so a rebuild recompiles only what changed.
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Build release APK
        working-directory: mobile
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
          RFE_VERBOSE: '1'
          SCCACHE_GHA_ENABLED: 'true'
          CMAKE_C_COMPILER_LAUNCHER: sccache
          CMAKE_CXX_COMPILER_LAUNCHER: sccache
          # A tag builds the ABIs the Flutter app shipped (no 32-bit x86); a branch dry run builds the one real phones use.
          RFE_ABIS: ${{ github.ref_type == 'tag' && 'arm64-v8a,armeabi-v7a,x86_64' || 'arm64-v8a' }}
        run: |
          scripts/build-release-apk.sh
          sccache --show-stats || true

      - name: Stage artifact + manifest
        id: stage
        run: |
          set -euo pipefail
          name="$(node -p "require('./mobile/app.json').expo.version")"
          code="$(node -p "require('./mobile/app.json').expo.android.versionCode")"
          prerelease=false
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag_ver="${GITHUB_REF_NAME#v}"
            case "$tag_ver" in *-*) prerelease=true ;; esac
            if [ "${tag_ver%%-*}" != "$name" ]; then
              echo "::error::tag '$GITHUB_REF_NAME' does not match app.json version '$name', bump app.json before tagging"
              exit 1
            fi
          fi
          apk="rfe-${name}-${code}.apk"
          cp mobile/android/app/build/outputs/apk/release/app-release.apk "$apk"
          size="$(stat -c%s "$apk")"
          sha256="$(sha256sum "$apk" | cut -d' ' -f1)"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${apk}"
          # versionName/versionCode/size as the agent's GET /v1/app/latest, plus the download url and the sha256 the
          # app requires before it will hand the file to the installer.
          printf '{"versionName":"%s","versionCode":%s,"size":%s,"url":"%s","sha256":"%s"}\n' \
            "$name" "$code" "$size" "$url" "$sha256" > latest.json
          echo "apk=$apk" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Built $apk ($size bytes), prerelease=$prerelease"
          cat latest.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rfe-${{ steps.stage.outputs.name }}-${{ steps.stage.outputs.code }}
          path: |
            ${{ steps.stage.outputs.apk }}
            latest.json
          retention-days: 14

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          APK: ${{ steps.stage.outputs.apk }}
          PRERELEASE: ${{ steps.stage.outputs.prerelease }}
        run: |
          set -euo pipefail
          # The updater reads releases/latest, so Latest is always explicit: a pre-release never takes it, and a
          # release takes it from whatever else (the agent's releases carry no latest.json) was published last.
          if [ "$PRERELEASE" = true ]; then flag="--prerelease --latest=false"; else flag="--latest"; fi
          gh release create "$GITHUB_REF_NAME" "$APK" latest.json \
            --title "v${{ steps.stage.outputs.name }} (build ${{ steps.stage.outputs.code }})" \
            --generate-notes $flag
