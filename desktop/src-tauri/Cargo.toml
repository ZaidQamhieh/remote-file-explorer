[package]
name = "rfe-desktop"
version = "0.1.0"
description = "RFE desktop PC control app (first slice: pin, log in, list devices)"
edition = "2021"
rust-version = "1.80"

[lib]
name = "rfe_desktop_lib"
crate-type = ["rlib"]

[[bin]]
name = "rfe-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
ed25519-dalek = "2"
getrandom = "0.2"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3"
